<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CGPA Calculator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #bbddff; margin: 0; padding: 2rem 1rem; }
    main { max-width: 34rem; margin: auto; background: #dee7ec; border: 2px solid #9638a5; border-radius: 8px; padding: 1.5rem; }
    h1, p { text-align: center; }
    .subject { display: grid; grid-template-columns: 1fr auto; gap: 1rem; margin: 1rem 0; align-items: center; }
    select, button { font: inherit; padding: .5rem; }
    button { width: 100%; cursor: pointer; }
    output { display: block; margin-top: 1rem; padding: 1rem; text-align: center; background: #f1f8d5; }
  </style>
</head>
<body>
  <main>
    <h1>CGPA Calculator</h1>
    <p>Calculate the equally weighted average of five subject grade points.</p>
    <form id="grade-form">
      <div id="subjects"></div>
      <button type="submit">Calculate CGPA</button>
      <output id="cgpa" aria-live="polite">Select grades and calculate.</output>
    </form>
    <p>Grade scale: O = 10, A+ = 9, A = 8, B = 7, C = 6, D = 5. This calculator assumes all five subjects carry equal credits.</p>
  </main>
  <script>
    "use strict";
    const gradePoints = Object.freeze({ O: 10, "A+": 9, A: 8, B: 7, C: 6, D: 5 });
    function calculateCgpa(grades) {
      if (!Array.isArray(grades) || grades.length !== 5 ||
          !grades.every(grade => Object.hasOwn(gradePoints, grade))) {
        throw new Error("Choose a valid grade for each of the five subjects.");
      }
      return grades.reduce((sum, grade) => sum + gradePoints[grade], 0) / grades.length;
    }
    const subjects = document.getElementById("subjects");
    for (let i = 1; i <= 5; i++) {
      const row = document.createElement("div");
      row.className = "subject";
      const label = document.createElement("label");
      label.htmlFor = "grade-" + i;
      label.textContent = "Subject " + i;
      const select = document.createElement("select");
      select.id = label.htmlFor;
      select.required = true;
      select.innerHTML = '<option value="">Choose grade</option>' +
        Object.keys(gradePoints).map(grade =>
          '<option value="' + grade + '">' + grade + '</option>').join("");
      row.append(label, select);
      subjects.append(row);
    }
    document.getElementById("grade-form").addEventListener("submit", event => {
      event.preventDefault();
      const grades = Array.from(subjects.querySelectorAll("select"), select => select.value);
      const output = document.getElementById("cgpa");
      try {
        output.textContent = "Your CGPA is: " + calculateCgpa(grades).toFixed(2);
      } catch (error) {
        output.textContent = error.message;
      }
    });
  </script>
</body>
</html>
